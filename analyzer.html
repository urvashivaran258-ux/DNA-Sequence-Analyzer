<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <h1>DNA Sequence Analyzer</h1>
    <p>Analyze Your DNA Sequence</p>
</header>

<nav class="navbar">
    <a href="index.html">Home</a>
    <a href="analyzer.html">Analyzer</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
</nav>

<main class="container">

    <section class="analyzer-section">

        <h2>DNA Analyzer</h2>

        <p class="instruction">
            Enter a DNA sequence using only A, T, G and C.
        </p>

        <textarea
            id="dnaSequence"
            placeholder="Example: ATGCGATTA">
        </textarea>

        <div class="button-group">
            <button onclick="analyzeDNA()">Analyze</button>
            <button onclick="clearDNA()">Clear</button>
        </div>

        <div id="result" class="result-box">
            <p>Enter a DNA sequence and click <b>Analyze</b>.</p>
        </div>

    </section>

</main>

<footer class="footer">
    <p>© 2026 DNA Sequence Analyzer</p>
</footer>

<script src="script.js"></script>

</body>
</html>

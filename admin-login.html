<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - DNA Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>🧬 DNA Sequence Analyzer</h1>
        <p>Admin Panel</p>
    </header>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="analyzer.html">Analyzer</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main class="container">

        <section class="analyzer-section">

            <h2>Admin Login</h2>

            <form id="adminLoginForm">

                <label for="adminUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="adminUsername"
                    placeholder="Enter username"
                    required
                >

                <br><br>

                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter password"
                    required
                >

                <br><br>

                <button type="submit">
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>

        </section>

    </main>

    <footer class="footer">
        <p>© 2026 DNA Sequence Analyzer</p>
    </footer>

    <script src="admin.js"></script>

</body>

</html>
